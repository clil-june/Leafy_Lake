<style>
.topbar h1 { display: none; }
.modes { margin: 0 auto; }
.hud .score { display: none; }
body.intro .top, body.intro .dock { opacity: 0; pointer-events: none; }
.top, .dock { transition: opacity 0.9s ease; }
/* Layout: one full-bleed watercolor pond canvas; a title top-left and glass controls docked to the bottom edge. */
:root {
  --pond-deep: #1b6bb8;
  --pond: #2f8fdc;
  --foam: #f2fbff;
  --ink: #0b3a6b;
  --glass: rgba(255, 255, 255, 0.4);
  --font-display: 'Outfit', 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-ui: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--pond);
  color: var(--foam);
  font-family: var(--font-ui);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
  background: var(--pond);
}
.top, .dock {
  position: fixed;
  left: 0;
  right: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 30px;
  letter-spacing: 0.02em;
  line-height: 1.1;
  text-shadow: 0 1px 14px rgba(8, 50, 110, 0.55);
}
.hint {
  margin: 6px 0 0;
  font-size: 15px;
  font-weight: 500;
  text-shadow: 0 1px 10px rgba(8, 50, 110, 0.7);
  transition: opacity 0.8s ease;
}
body.played .hint { opacity: 0; }
.dock {
  bottom: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.count {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 8px rgba(8, 50, 110, 0.8);
}
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button {
  pointer-events: auto;
  min-height: 48px;
  padding: 0 22px;
  border-radius: 999px;
  border: 0;
  background: var(--glass);
  color: var(--ink);
  font: 600 16px/1 var(--font-ui);
  cursor: pointer;
  -webkit-backdrop-filter: blur(28px) saturate(1.15);
  backdrop-filter: blur(28px) saturate(1.15);
  touch-action: manipulation;
}
button.primary { font-weight: 700; }
button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.85); color: var(--ink); }
button:active { transform: scale(0.97); }
button:focus-visible { outline: 3px solid var(--foam); outline-offset: 2px; }

.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.modes { pointer-events: auto; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--glass); border: 0; -webkit-backdrop-filter: blur(28px) saturate(1.15); backdrop-filter: blur(28px) saturate(1.15); }
.modes button { min-height: 36px; padding: 0 14px; font-size: 14px; border: 0; background: transparent; color: var(--ink); backdrop-filter: none; -webkit-backdrop-filter: none; }
.modes button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.85); color: var(--ink); }
.hud { margin-top: 0; display: flex; align-items: center; gap: 14px; font-size: 15px; font-weight: 600; text-shadow: 0 1px 10px rgba(8, 50, 110, 0.7); font-variant-numeric: tabular-nums; }
.hud b { font-size: 20px; }
.lives { display: flex; gap: 10px; align-items: center; }

<canvas id="pond" aria-label="A pond with autumn leaves. Drag a leaf to move it and leave a wake."></canvas>
<div class="top">
  <p class="hint" id="hint">Drag a leaf across the water to leave a wake.</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="over" id="over" hidden>
  <div class="card" role="dialog" aria-labelledby="overT">
    <h2 id="overT">Out of frogs</h2>
    <p>Score <b id="overScore">0</b> &middot; Best <b id="overBest">0</b></p>
    <div class="row">
      <button class="primary" id="again" type="button">Play again</button>
      <button id="toZen" type="button">Zen mode</button>
    </div>
  </div>
</div>
<div class="dock">
  <div class="hud" id="hud" hidden>
    <span class="lives" id="lives" role="img" aria-label="3 lives left"><i></i><i></i><i></i></span>
  </div>
  <div class="count" id="count" aria-live="polite"></div>
  <div class="row">
    <button class="primary" id="drop" type="button">Drop leaves</button>
  </div>
  <div class="modes" role="group" aria-label="Mode">
    <button id="mZen" type="button" aria-pressed="true">Zen</button>
    <button id="mGame" type="button" aria-pressed="false">Game</button>
  </div>
</div>

<script>
(() => {
  const TAU = Math.PI * 2;
  const cv = document.getElementById('pond');
  let ctx = cv.getContext('2d');
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const angd = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
  const mulberry = (a) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const main = ctx;

  function buildFrogSprites() { for (const k in FROGS) { const o = FROGS[k], im = new Image(); im.src = o.src; o.img = im; } FS.ready = true; }
  const frogOK = (o) => o.img && o.img.complete && o.img.naturalWidth > 0;

    const toastEl = document.getElementById('toast');
  let toastT = 0;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 1500);
  }
  function setHud() {
    const dots = document.querySelectorAll('#lives i');
    dots.forEach((d, i) => d.classList.toggle('off', i >= game.lives));
    document.getElementById('lives').setAttribute('aria-label', game.lives + ' lives left');
  }
  function loseLife() {
    game.lives = Math.max(0, game.lives - 1); setHud();
    if (game.lives <= 0 && !game.over) endGame();
  }
  function endGame() {
    game.over = true;
    if (game.score > game.best) { game.best = game.score; try { localStorage.setItem('leafyLake.best', String(game.best)); } catch (_) {} }
    document.getElementById('overScore').textContent = game.score;
    document.getElementById('overBest').textContent = game.best;
    document.getElementById('over').hidden = false;
    try { document.getElementById('again').focus(); } catch (_) {}
  }
  function startGame() {
    frogs.length = 0; for (const l of leaves) l.frog = null;
    game.over = false; game.score = 0; game.lives = 3; game.nextFrog = 2;
    document.getElementById('over').hidden = true;
    setHud();
  }

  function catchRadius() { return R0 * 0.62; }

  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  document.getElementById('drop').addEventListener('click', () => dropLeaves(4, 0));
  document.getElementById('mZen').addEventListener('click', () => setMode('zen'));
  document.getElementById('mGame').addEventListener('click', () => setMode('game'));
  document.getElementById('again').addEventListener('click', () => startGame());
  document.getElementById('toZen').addEventListener('click', () => setMode('zen'));
  /* ---------- Sizing and loop ---------- */
  function resize() {
    const oW = W, oH = H;
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.ceil(W * DPR); cv.height = Math.ceil(H * DPR);
    lc.width = cv.width; lc.height = cv.height;
    R0 = clamp(Math.min(W, H) * 0.16, 50, 96);
    if (oW) {
      const sx = W / oW, sy = H / oH;
      for (const l of leaves) { l.x *= sx; l.y *= sy; l.lx *= sx; l.ly *= sy; l.trail.length = 0; }
      ripples.length = 0;
    }
    for (const l of leaves) l.r = R0 * l.rr;
    buildWater();
  }
  let rt = 0;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120); });

  let last = performance.now() / 1000;
  /* ---------- Opening scene: a leaf with the title falls, lands, sinks, game starts ---------- */
  let intro = null;
  function buildIntro(startCb) {
    let best = SPR[0], bd = 9;
    for (const s of SPR) { const d = Math.abs(Math.log(s.w / s.h)); if (d < bd) { bd = d; best = s; } }
    const sp = best, mkC = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
    const base = rnd(-0.35, 0.35);
    const ready = () => {
      const text = mkC(sp.w, sp.h), g = text.getContext('2d'), size = sp.rt * 0.52;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = '600 ' + size + 'px Outfit, "DM Sans", system-ui, sans-serif';
      // find the body of the leaf (ignore the stem) so the title sits on it
      const pr = mkC(sp.w, sp.h), pg = pr.getContext('2d'); pg.drawImage(sp.img, 0, 0);
      const id = pg.getImageData(0, 0, sp.w, sp.h).data; let mx = 0, my = 0, mn = 0, x0 = 1e9, x1 = -1;
      for (let yy = 0; yy < sp.h; yy += 2) for (let xx = 0; xx < sp.w; xx += 2) if (id[(yy * sp.w + xx) * 4 + 3] > 120) { mx += xx; my += yy; mn++; x0 = Math.min(x0, xx); x1 = Math.max(x1, xx); }
      const cx = mn ? mx / mn : sp.px, cy = mn ? my / mn : sp.py, bw = Math.max(40, x1 - x0);
      let fs = size; g.font = '600 ' + fs + 'px Outfit, "DM Sans", system-ui, sans-serif';
      const wmax = bw * 0.44, mw = Math.max(g.measureText('Leafy').width, g.measureText('Lake').width);
      fs = fs * Math.min(1, wmax / mw); g.font = '600 ' + fs + 'px Outfit, "DM Sans", system-ui, sans-serif';
      g.translate(cx, cy); g.rotate(-base);
      // the title is a hole punched through the leaf (water shows through), with a thin darker rim
      g.drawImage(sp.img, -cx, -cy); // placeholder so the text canvas is rebuilt below
      g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, sp.w, sp.h);
      g.drawImage(sp.img, 0, 0);
      g.translate(cx, cy); g.rotate(-base);
      g.lineJoin = 'round'; g.lineWidth = fs * 0.09; g.strokeStyle = 'rgba(86,30,8,0.6)';
      g.strokeText('Leafy', 0, -fs * 0.52); g.strokeText('Lake', 0, fs * 0.55);
      g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000';
      g.fillText('Leafy', 0, -fs * 0.52); g.fillText('Lake', 0, fs * 0.55);
      g.setTransform(1, 0, 0, 1, 0, 0);
      intro = { t: 0, sp, text, base, started: false, r: R0 * 2.35, landY: H * 0.47, x0: W / 2, rip: 0, startCb };
    };
    (document.fonts && document.fonts.load ? document.fonts.load('600 40px Outfit').catch(() => {}) : Promise.resolve()).then(ready, ready);
  }
  const INTRO_FALL = 6.6, INTRO_START = 8.6, INTRO_END = 9.5;
  function stepIntro(dt) {
    const I = intro; I.t += dt;
    if (I.t >= INTRO_FALL && I.rip === 0) { I.rip = 1; const p = introPos(I, 1); addRipple(p.x, I.landY, I.r * 0.2, I.r * 2.2, 2.2, 0.9, 4); addRipple(p.x, I.landY, I.r * 0.2, I.r * 1.3, 1.6, 0.7, 2, 0.25); }
    if (I.t >= INTRO_FALL + 1.3 && I.rip === 1) { I.rip = 2; const p = introPos(I, 1); addRipple(p.x, I.landY, I.r * 0.4, I.r * 1.6, 1.8, 0.7, 3); }
    if (I.t >= INTRO_START && !I.started) { I.started = true; I.startCb(); }
    if (I.t >= INTRO_END) intro = null;
  }
  function introPos(I, p) {
    const A = Math.min(W * 0.4, 190), y0 = -I.r * 1.6, ph = p * TAU * 1.5 + 0.6, damp = 1 - p * 0.8;
    return {
      x: I.x0 + A * Math.sin(ph) * damp,
      y: y0 + (I.landY - y0) * (p + 0.035 * Math.sin(p * TAU * 2.7) * (1 - p)),
      sway: Math.cos(ph) * 0.5 * (1 - p * 0.75)
    };
  }
  function drawIntro() {
    const I = intro; if (!I) return;
    const p = Math.min(1, I.t / INTRO_FALL), pos = introPos(I, p), sp = I.sp, z = 1 - p;
    let x = pos.x, y = pos.y, alpha = 1, tAlpha = 1, sc = 1, flip = 1, rot = I.base + pos.sway;
    if (I.t > INTRO_FALL) {
      const f = I.t - INTRO_FALL, q = clamp((f - 0.9) / 1.4, 0, 1);
      x = introPos(I, 1).x + Math.sin(f * 1.7) * 2; y = I.landY + Math.sin(f * 2.1) * 1.5;
      rot = I.base + Math.sin(f * 1.3) * 0.03; sc = 1 - 0.08 * q;
      alpha = 1 - Math.pow(q, 1.4); tAlpha = clamp(1 - q * 1.8, 0, 1);
    } else {
      flip = 1 - (1 - Math.abs(Math.cos(I.t * 2.2))) * 0.16 * z;
    }
    const k = I.r / sp.rt * sc;
    const sa = 0.4 * sm01(0.15, 1, p) * alpha;
    if (sa > 0.01) {
      ctx.save(); ctx.globalAlpha = sa; ctx.translate(x + 26 * z + 6, I.landY + 8); ctx.rotate(rot); ctx.scale(k * (1 + z * 0.25), k * (1 + z * 0.25));
      ctx.drawImage(sp.soft, -(sp.px + 56), -(sp.py + 56)); ctx.restore(); ctx.globalAlpha = 1;
    }
    if (alpha < 0.01) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k * flip, k);
    ctx.globalAlpha = alpha; ctx.drawImage(I.text, -sp.px, -sp.py);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  function frame(ts) {
    const now = ts / 1000;
    const dt = Math.min(0.05, Math.max(0.001, now - last));
    last = now; time += dt;
    if (intro) stepIntro(dt);
    update(dt); draw(); drawIntro();
    requestAnimationFrame(frame);
  }

  resize();
  buildLayers();
  buildWakeSprites();
  window.__leaves = leaves;
  buildFrogSprites();
  try { game.best = parseInt(localStorage.getItem('leafyLake.best') || '0', 10) || 0; } catch (_) {}
  document.body.classList.add('intro');
  prepSprites(() => {
    let m = 'zen';
    try { m = localStorage.getItem('leafyLake.mode') === 'game' ? 'game' : 'zen'; } catch (_) {}
    const begin = () => { document.body.classList.remove('intro'); dropLeaves(4, 0.3); setMode(m); };
    if (SPR.length) buildIntro(begin); else begin();
  });
  cv.addEventListener('pointerdown', () => { if (intro && intro.t < INTRO_START) intro.t = INTRO_START; });
  // Remove the injected "Powered by Netlify" badge (it appears ~3s after load): once at 5s and again at 7s
  const dropBadge = () => document.querySelectorAll('#nl-badge-frame, iframe[title="Powered by Netlify"]').forEach(n => n.remove());
  setTimeout(dropBadge, 5000); setTimeout(dropBadge, 7000);
  window.__dbg = { game, frogs, leaves, FS, SPR, get intro() { return intro; }, R: () => [W, H, R0, DPR] };
  requestAnimationFrame(frame);
})();
</script>
